<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LocalOps</title>
    <style>
      /*
        Matches the dark baseline theme (and the window's BackgroundColour
        set in cmd/desktop/main.go) so there is no white flash before the
        stylesheet and React app take over. The light palette in
        global.css/tokens.css overrides this once loaded, under
        prefers-color-scheme: light.
      */
      html,
      body {
        margin: 0;
        background: #1b1c1f;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f5f7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
